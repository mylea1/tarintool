name: Build CPU worker image

on:
  push:
    branches: [master]
    paths:
      - "gpu-worker/**"
      - ".github/workflows/build-cpu-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cpu-worker-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install worker test dependencies
        working-directory: gpu-worker
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            --index-url https://mirrors.ustc.edu.cn/pypi/simple \
            --requirement requirements-test.txt

      - name: Test worker logic
        working-directory: gpu-worker
        run: python -m unittest discover -s tests -v

      - name: Download pinned YOLO pose weights
        working-directory: gpu-worker
        run: |
          curl --fail --location \
            --retry 5 --retry-all-errors \
            --output yolo11n-pose.pt \
            https://github.com/ultralytics/assets/releases/download/v8.3.0/yolo11n-pose.pt
          echo "869e83fcdffdc7371fa4e34cd8e51c838cc729571d1635e5141e3075e9319dc0  yolo11n-pose.pt" | sha256sum --check --strict

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/tarintool-cpu-worker
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and publish CPU image
        uses: docker/build-push-action@v6
        with:
          context: ./gpu-worker
          file: ./gpu-worker/Dockerfile.cpu
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

name: Build Android APK

on:
  push:
    branches: [master]
    paths:
      - "mobile/**"
      - ".github/workflows/build-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        run: flutter test --no-pub

      - name: Build universal release APK
        run: >-
          flutter build apk --release
          --dart-define=KILO_API_BASE_URL=https://api.kilostrength.cn

      - name: Preserve universal APK
        # Give the universal package a stable, user-facing name before the
        # split build reuses Flutter's output directory.
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/kilo-strength-1.0.17-universal.apk

      - name: Build optimized per-ABI APKs
        run: >-
          flutter build apk --release --split-per-abi
          --dart-define=KILO_API_BASE_URL=https://api.kilostrength.cn

      - name: Upload installable APKs
        uses: actions/upload-artifact@v4
        with:
          name: kilo-strength-android-1.0.17
          path: |
            mobile/build/app/outputs/flutter-apk/kilo-strength-1.0.17-universal.apk
            mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            mobile/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            mobile/build/app/outputs/flutter-apk/app-x86_64-release.apk
          if-no-files-found: error
          retention-days: 14

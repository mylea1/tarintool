name: Build Android APK

on:
  push:
    branches: [master]
    paths:
      - "mobile/**"
      - ".github/workflows/build-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        run: flutter test --no-pub

      - name: Build installable China debug APK
        run: >-
          flutter build apk --debug --flavor cn
          --dart-define=APP_MARKET=cn
          --dart-define=KILO_API_BASE_URL=https://api.kilostrength.cn
          --dart-define=KILO_SOURCE_COMMIT=${{ github.sha }}

      - name: Preserve installable APK
        run: cp build/app/outputs/flutter-apk/app-cn-debug.apk build/app/outputs/flutter-apk/KILOSTRENGTH-cn-debug.apk

      - name: Upload installable APKs
        uses: actions/upload-artifact@v4
        with:
          name: kilo-strength-android-cn-debug
          path: mobile/build/app/outputs/flutter-apk/KILOSTRENGTH-cn-debug.apk
          if-no-files-found: error
          retention-days: 14

workflows:
  ios-check:
    name: KILO iOS unsigned check
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: mobile
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/Library/Caches/CocoaPods
    scripts:
      - name: Install Flutter dependencies
        script: flutter pub get
      - name: Analyze
        script: flutter analyze
      - name: Run tests
        script: flutter test
      - name: Build unsigned iOS app
        script: flutter build ios --release --no-codesign
    artifacts:
      - mobile/build/ios/iphoneos/*.app
      - mobile/flutter_drive.log

  ios-release:
    name: KILO iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 90
    working_directory: mobile
    integrations:
      app_store_connect: 赵学昆
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.kilostrength.kiloStrength
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/Library/Caches/CocoaPods
    scripts:
      - name: Install Flutter dependencies
        script: flutter pub get
      - name: Analyze
        script: flutter analyze
      - name: Run tests
        script: flutter test
      - name: Apply provisioning profiles
        script: xcode-project use-profiles
      - name: Build signed IPA
        script: >-
          flutter build ipa --release
          --dart-define=ENABLE_TEST_ADMIN=true
          --dart-define=KILO_API_BASE_URL=https://magnitude-detail-pipe-cake.trycloudflare.com
          --build-name=1.0.12
          --build-number=$BUILD_NUMBER
          --export-options-plist=$HOME/export_options.plist
      - name: Verify IPA artifact
        script: |
          IPA_PATH=$(find "$CM_BUILD_DIR/mobile/build/ios/ipa" -type f -name "*.ipa" | head -1)
          if [ -z "$IPA_PATH" ]; then
            echo "IPA artifact was not generated"
            exit 1
          fi
          echo "Found IPA: $IPA_PATH"
    artifacts:
      - $CM_BUILD_DIR/mobile/build/ios/ipa/*.ipa
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
      - mobile/flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration

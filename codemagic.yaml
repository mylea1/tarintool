workflows:
  ios-check:
    name: KILO iOS unsigned check
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: mobile
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/Library/Caches/CocoaPods
    scripts:
      - name: Install Flutter dependencies
        script: flutter pub get
      - name: Analyze
        script: flutter analyze
      - name: Run tests
        script: flutter test
      - name: Build unsigned iOS app
        script: flutter build ios --release --no-codesign --dart-define=KILO_SOURCE_COMMIT="${CM_COMMIT:-unknown}"
    artifacts:
      - mobile/build/ios/iphoneos/*.app
      - mobile/flutter_drive.log

  ios-release:
    name: KILO iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 90
    working_directory: mobile
    integrations:
      app_store_connect: 赵学昆
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.kilostrength.kiloStrength
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/Library/Caches/CocoaPods
    scripts:
      - name: Install Flutter dependencies
        script: flutter pub get
      - name: Analyze
        script: flutter analyze
      - name: Run tests
        script: flutter test
      - name: Apply provisioning profiles
        script: |
          echo "Provisioning profiles available to this build:"
          find "$HOME/Library/MobileDevice/Provisioning Profiles" -maxdepth 1 -type f -name "*.mobileprovision" -print || true
          xcode-project use-profiles
      - name: Build signed IPA (config v3)
        script: |
          echo "Codemagic config v3; source commit: ${CM_COMMIT:-unknown}"
          flutter build ipa --release --dart-define=APP_MARKET=cn --dart-define=KILO_API_BASE_URL=https://api.kilostrength.cn --dart-define=KILO_SOURCE_COMMIT="${CM_COMMIT:-unknown}" --build-number="$BUILD_NUMBER" --export-options-plist="$HOME/export_options.plist"
      - name: Verify IPA artifact
        script: |
          IPA_PATH=$(find "$CM_BUILD_DIR/mobile/build/ios/ipa" -type f -name "*.ipa" | head -1)
          if [ -z "$IPA_PATH" ]; then
            echo "IPA artifact was not generated"
            exit 1
          fi
          echo "Found IPA: $IPA_PATH"
          VERIFY_DIR=$(mktemp -d)
          unzip -q "$IPA_PATH" -d "$VERIFY_DIR"
          RUNNER_APP="$VERIFY_DIR/Payload/Runner.app"
          codesign -d --entitlements :- "$RUNNER_APP" > "$VERIFY_DIR/app-entitlements.plist"
          security cms -D -i "$RUNNER_APP/embedded.mobileprovision" > "$VERIFY_DIR/profile.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.applesignin:0' "$VERIFY_DIR/app-entitlements.plist")" = "Default"
          test "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.applesignin:0' "$VERIFY_DIR/profile.plist")" = "Default"
          echo "Apple Sign In entitlement verified in app signature and provisioning profile."
    artifacts:
      - $CM_BUILD_DIR/mobile/build/ios/ipa/*.ipa
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
      - mobile/flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration

  android-release-check:
    name: KILO Android CN signed APK and AAB
    instance_type: linux_x2
    max_build_duration: 90
    working_directory: mobile
    environment:
      flutter: stable
      java: 17
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/.gradle/caches
    scripts:
      - name: Install Flutter dependencies
        script: flutter pub get
      - name: Analyze
        script: flutter analyze
      - name: Run tests
        script: flutter test
      - name: Build signed CN release APK and AAB
        script: |
          export KILO_SOURCE_COMMIT="${CM_COMMIT:-unknown}"
          bash ./tool/build_android_release.sh cn
    artifacts:
      - mobile/build/app/outputs/flutter-apk/app-cn-release.apk
      - mobile/build/app/outputs/bundle/cnRelease/app-cn-release.aab

  android-global-release-check:
    name: KILO Android global signed APK and AAB
    instance_type: linux_x2
    max_build_duration: 90
    working_directory: mobile
    environment:
      flutter: stable
      java: 17
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/.gradle/caches
    scripts:
      - name: Install Flutter dependencies
        script: flutter pub get
      - name: Analyze
        script: flutter analyze
      - name: Run tests
        script: flutter test
      - name: Build signed global release APK and AAB
        script: |
          export KILO_SOURCE_COMMIT="${CM_COMMIT:-unknown}"
          bash ./tool/build_android_release.sh global
    artifacts:
      - mobile/build/app/outputs/flutter-apk/app-global-release.apk
      - mobile/build/app/outputs/bundle/globalRelease/app-global-release.aab

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>EMBER Logo Options</title>
  <style>
    :root{color-scheme:light dark;--bg:#f7f3ee;--surface:#fffdfa;--ink:#231e1b;--muted:#746a64;--line:#ded5ce;--accent:#e55316;--soft:#fff0e6}
    @media(prefers-color-scheme:dark){:root{--bg:#181513;--surface:#24201d;--ink:#f7f1ec;--muted:#bcb1aa;--line:#493f39;--accent:#ff6a2a;--soft:#35241c}}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    main{width:min(1180px,calc(100% - 32px));margin:auto;padding:44px 0 68px}header{display:flex;justify-content:space-between;align-items:end;gap:24px}
    h1{margin:0;font-size:clamp(34px,5vw,62px);line-height:1;letter-spacing:-.045em}header p{max-width:47ch;margin:12px 0 0;color:var(--muted);line-height:1.65}.hint{color:var(--muted);font-size:13px;text-align:right}
    .grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px;margin-top:32px}.option{position:relative;display:block;min-width:0;border:1px solid var(--line);border-radius:25px;background:var(--surface);padding:10px;cursor:pointer;transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}
    .option:hover{transform:translateY(-3px);box-shadow:0 15px 35px rgba(83,45,24,.11)}input{position:absolute;opacity:0;pointer-events:none}.option:has(input:checked){border-color:var(--accent);background:var(--soft);box-shadow:0 0 0 2px var(--accent)}
    img{display:block;width:100%;aspect-ratio:1;border-radius:18px;object-fit:cover}.meta{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:12px 5px 4px}.name{font-weight:750}.code{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--surface);font-size:12px;font-weight:800}
    .small{display:flex;min-width:0;align-items:center;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:12px;overflow-wrap:anywhere}.small img{width:26px;border-radius:7px}.check{color:var(--accent);font-weight:800;opacity:0}.option:has(input:checked) .check{opacity:1}
    footer{display:flex;justify-content:space-between;gap:20px;margin-top:26px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);line-height:1.6}#selection{color:var(--accent);font-weight:800}
    @media(max-width:900px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:560px){main{width:min(100% - 24px,480px);padding-top:28px}header{display:block}.hint{text-align:left;margin-top:12px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.option{border-radius:20px;padding:7px}img{border-radius:15px}.meta{padding-top:9px}footer{display:block}}
    @media(prefers-reduced-motion:reduce){.option{transition:none}}
  </style>
</head>
<body>
<main>
  <header>
    <div><h1>EMBER / &#28861;&#32451;</h1><p>&#24180;&#36731;&#12289;&#28201;&#26262;&#12289;&#26377;&#36895;&#24230;&#24863;&#30340;&#21147;&#37327;&#35757;&#32451;&#22270;&#26631;&#12290;&#28857;&#20987;&#21345;&#29255;&#36873;&#25321;&#65292;&#21516;&#26102;&#26816;&#26597; 26px &#23567;&#23610;&#23544;&#36776;&#35782;&#24230;&#12290;</p></div>
    <div class="hint">10 directions<br>A&#8211;J</div>
  </header>
  <section class="grid" id="grid"></section>
  <footer><div>&#24314;&#35758;&#20248;&#20808;&#27604;&#36739; C / G / J&#65306;&#36718;&#24275;&#26356;&#21333;&#32431;&#65292;&#22312;&#25163;&#26426;&#26700;&#38754;&#19978;&#26356;&#28165;&#26970;&#12290;</div><div>&#24403;&#21069;&#36873;&#25321;&#65306;<span id="selection">&#26410;&#36873;&#25321;</span></div></footer>
</main>
<script>
  const names={A:'Blaze Rise',B:'Sun Plate',C:'Spark Check',D:'Twin Loop',E:'Up Arc',F:'Volt Plate',G:'Fold Rush',H:'Core Lift',I:'Smart Orbit',J:'Progress Pulse'};
  const grid=document.querySelector('#grid'),selection=document.querySelector('#selection');
  Object.entries(names).forEach(([code,name])=>{const label=document.createElement('label');label.className='option';label.innerHTML=`<input type="radio" name="logo" value="${code}"><img src="${code}.png" alt="Logo option ${code}"><div class="meta"><span class="name">${name}</span><span class="code">${code}</span></div><div class="small"><img src="${code}.png" alt=""><span>26px preview</span><span class="check">Selected</span></div>`;grid.append(label)});
  grid.addEventListener('change',event=>{const code=event.target.value;localStorage.setItem('ember-logo',code);selection.textContent=`${code} / ${names[code]}`});
  const saved=localStorage.getItem('ember-logo');if(saved&&names[saved]){const input=document.querySelector(`input[value="${saved}"]`);input.checked=true;selection.textContent=`${saved} / ${names[saved]}`}
</script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>形域 · 统计与好友预览</title>
  <style>
    :root{--bg:#fff8f2;--surface:#fff;--ink:#211915;--muted:#796b63;--line:#eadfd7;--orange:#df5815;--soft:#fff0e5;--green:#16845a;--purple:#6840a8}
    *{box-sizing:border-box}body{margin:0;background:#eee9e5;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden}.board{display:grid;grid-template-columns:repeat(2,minmax(0,390px));gap:22px;justify-content:center;padding:22px}.phone{min-width:0;height:844px;overflow:auto;background:var(--bg);border:7px solid #211b18;border-radius:36px;padding:18px 14px 34px;box-shadow:0 20px 55px #3d2a1c22}h1{font-size:27px;margin:12px 0 16px}.switch,.period{display:flex;gap:5px;background:#f2ece7;border-radius:14px;padding:4px;min-width:0}.switch button,.period button{min-width:0;flex:1;border:0;background:transparent;padding:9px 4px;border-radius:11px;font-weight:800;color:var(--muted);overflow-wrap:anywhere}button.active{background:#fff;color:var(--ink);box-shadow:0 3px 12px #4d352022}.section{margin-top:18px}.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}.section-head h2{font-size:20px;margin:0}.link{border:0;background:transparent;color:var(--orange);font-weight:800}.card{min-width:0;background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:11px}.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.metric{min-width:0}.metric small,.sub{display:block;color:var(--muted);font-size:12px}.metric b{font-size:22px}.chart{height:190px;margin-top:14px;position:relative;border-bottom:1px solid var(--line);background:repeating-linear-gradient(to bottom,transparent 0 46px,#eee5de 47px)}.bars{position:absolute;inset:18px 8px 0;display:flex;align-items:flex-end;gap:7px}.bar{flex:1;background:#ffd99d;border-radius:7px 7px 2px 2px}.bar:last-child{background:var(--orange)}svg.line{position:absolute;inset:18px 8px 0;width:calc(100% - 16px);height:calc(100% - 18px);overflow:visible}.legend{display:flex;gap:18px;margin-top:10px;font-size:12px;color:var(--muted)}.dot{display:inline-block;width:10px;height:10px;border-radius:3px;background:#ffd38e;margin-right:5px}.dot.p{border-radius:99px;background:var(--purple)}.body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:center}.human{height:220px;border-radius:16px;background:linear-gradient(180deg,#fff6ed,#fff);display:grid;place-items:center;position:relative}.human span{font-size:96px;filter:saturate(.7)}.heat{position:absolute;width:30px;height:22px;border-radius:50%;background:#e86021aa;filter:blur(4px)}.heat.chest{top:62px;left:40%}.heat.legs{top:144px;left:35%;width:42px;height:44px}.muscles div{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f2e8e1}.feed-head{display:flex;gap:11px;align-items:center}.avatar{width:43px;height:43px;border-radius:14px;background:var(--soft);display:grid;place-items:center;font-weight:900;color:var(--orange)}.grow{flex:1;min-width:0}.plan{margin:12px 0;padding:12px;border-radius:14px;background:#fff8f2}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 12px;font-weight:800}.actions button:last-child{margin-left:auto;color:var(--orange)}.composer{display:flex;gap:8px}.composer input{min-width:0;flex:1;border:1px solid var(--line);border-radius:13px;padding:11px;background:#fff}.composer button{border:0;border-radius:13px;background:var(--orange);color:#fff;font-weight:900;padding:0 14px}.privacy{padding:10px 12px;background:#f4f0ed;border-radius:14px;color:var(--muted);font-size:12px}@media(max-width:820px){.board{width:100%;grid-template-columns:minmax(0,1fr);padding:0}.phone{width:100%;border-width:0;border-radius:0;min-height:100dvh;height:auto}.phone+ .phone{border-top:12px solid #eee9e5}}@media(max-width:350px){.phone{padding-inline:10px}.metric b{font-size:19px}.body{grid-template-columns:1fr}.human{height:180px}.human span{font-size:82px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
  </style>
</head>
<body><main class="board">
  <section class="phone">
    <h1>训练记录</h1><div class="switch"><button>记录</button><button class="active">统计</button></div>
    <div class="period"><button class="active">周</button><button>月</button><button>年</button><button>自定义</button></div>
    <section class="section"><div class="section-head"><h2>训练概况</h2><button class="link" onclick="alert('打开统计设置')">设置</button></div>
      <article class="card"><div class="metrics"><div class="metric"><small>训练时间</small><b>4.8h</b></div><div class="metric"><small>训练容量</small><b>18.6t</b></div><div class="metric"><small>有效组</small><b>42</b></div></div><div class="chart"><div class="bars"><i class="bar" style="height:28%"></i><i class="bar" style="height:47%"></i><i class="bar" style="height:36%"></i><i class="bar" style="height:72%"></i><i class="bar" style="height:58%"></i><i class="bar" style="height:84%"></i><i class="bar" style="height:63%"></i></div><svg class="line" viewBox="0 0 300 160" preserveAspectRatio="none"><polyline fill="none" stroke="#6840a8" stroke-width="4" points="4,128 52,108 100,116 148,65 196,88 244,39 296,72"/></svg></div><div class="legend"><span><i class="dot"></i>训练容量</span><span><i class="dot p"></i>每次平均</span></div></article>
    </section>
    <section class="section"><div class="section-head"><h2>部位概览</h2><span class="sub">完成组贡献</span></div><article class="card body"><div class="human"><span>🏋️</span><i class="heat chest"></i><i class="heat legs"></i></div><div class="muscles"><div><b>胸</b><span>14 组</span></div><div><b>腿</b><span>12 组</span></div><div><b>肩</b><span>8 组</span></div><div><b>背</b><span>6 组</span></div><div><b>核心</b><span>2 组</span></div></div></article></section>
  </section>
  <section class="phone">
    <h1>训练好友</h1><div class="switch"><button class="active">动态</button><button>好友</button><button>添加</button></div>
    <p class="privacy">只有双方成为好友后才能查看共享计划；训练备注默认不公开。</p>
    <section class="section"><article class="card"><div class="feed-head"><div class="avatar">林</div><div class="grow"><b>林野</b><span class="sub">今天 19:42 · 完成推训练</span></div><span>🔥 3</span></div><div class="plan"><b>胸肩三头 · 56 分钟</b><span class="sub">杠铃卧推、上斜哑铃卧推、侧平举 · 16 组</span></div><div class="actions"><button onclick="this.textContent='🔥 已赞'">🔥 点赞</button><button onclick="this.textContent='💪 已发送'">💪</button><button onclick="alert('计划已保存到我的计划，可在训练页编辑')">保存计划</button></div></article>
      <article class="card"><div class="feed-head"><div class="avatar">夜</div><div class="grow"><b>夜行者</b><span class="sub">昨天 · 分享腿部力量 A</span></div><span>👏 5</span></div><div class="plan"><b>腿部力量 A</b><span class="sub">深蹲、罗马尼亚硬拉、腿举 · 14 组</span></div><div class="actions"><button>👏 点赞</button><button>👊</button><button>保存计划</button></div></article>
    </section>
    <section class="section"><div class="section-head"><h2>添加好友</h2><span class="sub">手机号或形域 ID</span></div><div class="composer"><input placeholder="输入账号"><button>搜索</button></div></section>
  </section>
</main><script>document.querySelectorAll('.switch,.period').forEach(group=>group.addEventListener('click',e=>{if(e.target.tagName!=='BUTTON')return;group.querySelectorAll('button').forEach(x=>x.classList.remove('active'));e.target.classList.add('active')}));</script></body></html>

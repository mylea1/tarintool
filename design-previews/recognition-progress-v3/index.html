<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>动作识别等待态</title><style>
:root{--bg:#fff8f1;--card:#fff;--ink:#261b16;--muted:#7b6b62;--orange:#e75512;--soft:#fff0e5;--line:#eadbd0;--green:#21875b}*{box-sizing:border-box}body{margin:0;background:#ececec;font:14px system-ui;color:var(--ink)}main{width:min(390px,100%);min-height:100dvh;margin:auto;background:var(--bg);padding:18px 14px 40px}.top{display:flex;align-items:center;gap:10px;font-weight:850;font-size:20px}.logo{width:28px;height:28px;border-radius:9px;background:var(--orange);display:grid;place-items:center;color:#fff}.card{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px;box-shadow:0 8px 24px #8f4d2410}.video{aspect-ratio:16/9;border-radius:16px;background:linear-gradient(135deg,#352a25,#130f0d);display:grid;place-items:center;color:#fff;position:relative;overflow:hidden}.play{width:54px;height:54px;border:0;border-radius:50%;font-size:22px;color:#fff;background:#e75512e8}.video small{position:absolute;left:12px;bottom:10px;background:#0009;padding:5px 8px;border-radius:8px}.waiting{display:flex;gap:12px;align-items:center;margin-top:16px}.radar{width:52px;height:52px;border-radius:50%;border:3px solid #f9cbb0;position:relative}.radar:before{content:"";position:absolute;inset:5px;border:3px solid var(--orange);border-top-color:transparent;border-radius:50%;animation:spin 1s linear infinite}.radar:after{content:"";position:absolute;inset:19px;background:var(--orange);border-radius:50%;animation:pulse 1.2s ease-in-out infinite}.waiting b{display:block;font-size:17px}.waiting span{color:var(--muted);font-size:12px}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:16px}.step{border-radius:12px;padding:9px 5px;text-align:center;background:#f6f1ed;color:#8a7a70;font-size:12px}.step.done{background:#e8f6ee;color:var(--green)}.step.on{background:var(--soft);color:var(--orange);font-weight:800}.note{margin-top:12px;color:var(--muted);font-size:12px;line-height:1.55}.error{display:none;margin-top:14px;padding:12px;border-radius:14px;background:#fff0ed;color:#aa301d}.actions{display:flex;gap:8px;margin-top:14px}.actions button{flex:1;min-height:44px;border-radius:14px;border:1px solid var(--line);background:white;font-weight:750}.actions .primary{background:var(--orange);border-color:var(--orange);color:white}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{transform:scale(.55);opacity:.45}}@media(prefers-reduced-motion:reduce){.radar:before,.radar:after{animation:none}}
</style><main><div class="top"><span class="logo">形</span>动作识别</div><section class="card"><div class="video"><button class="play" id="play">▶</button><small>0058f7…mp4 · 18.6 秒</small></div><div class="waiting" id="waiting"><div class="radar"></div><div><b id="title">正在分析动作轨迹</b><span id="elapsed">已等待 00:00 · 可以离开此页面</span></div></div><div class="steps"><div class="step done">✓ 已上传</div><div class="step done">✓ 已排队</div><div class="step on">分析中</div></div><div class="note">CPU 正在逐帧提取骨骼关键点，通常需要约 1 分钟。请勿重复提交。</div><div class="error" id="error">网络连接中断，视频已保留，可直接重试，无需重新选择。</div><div class="actions"><button id="fail">预览失败态</button><button class="primary">查看任务状态</button></div></section></main><script>
let sec=0,t=setInterval(()=>{sec++;elapsed.textContent=`已等待 ${String(sec/60|0).padStart(2,'0')}:${String(sec%60).padStart(2,'0')} · 可以离开此页面`},1000);play.onclick=()=>play.textContent=play.textContent==='▶'?'❚❚':'▶';fail.onclick=()=>{clearInterval(t);waiting.style.display='none';error.style.display='block';fail.textContent='重新分析'};
</script></html>

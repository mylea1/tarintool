<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>形域 - 训练与动作识别交互预览</title>
  <style>
    :root{--bg:#fff8f2;--surface:#fff;--ink:#271c17;--muted:#776760;--line:#eaded5;--accent:#e85d18;--accent-soft:#fff0e6;--ok:#e4f5e9;--ok-ink:#17633d;--radius:16px}
    *{box-sizing:border-box}body{margin:0;background:#eee9e5;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","PingFang SC",sans-serif}.stage{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,390px));gap:24px;align-items:start;justify-content:center;padding:28px}.phone{width:100%;min-height:780px;background:var(--bg);border:1px solid #d8cec7;border-radius:34px;overflow:hidden;box-shadow:0 18px 50px rgba(65,42,27,.12)}header{height:66px;padding:18px 18px 12px;display:flex;align-items:center;justify-content:space-between}h1{font-size:21px;margin:0}h2{font-size:18px;margin:0}.sub{font-size:12px;color:var(--muted)}.content{padding:0 16px 100px}.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}.search{display:flex;gap:8px;border:1px solid var(--line);border-radius:13px;padding:11px 12px;background:#fff}.search input{border:0;outline:0;width:100%;font-size:15px}.filters{display:flex;gap:7px;overflow:auto;padding:10px 0}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;white-space:nowrap;color:var(--muted)}.chip.active{background:var(--accent-soft);border-color:#f3a174;color:var(--accent);font-weight:700}.picker{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px}.rail{display:flex;flex-direction:column;gap:6px}.rail button{min-height:43px;border:0;border-radius:12px;background:transparent;color:var(--muted)}.rail button.active{background:var(--accent-soft);color:var(--accent);font-weight:800;border-left:3px solid var(--accent)}.list{min-width:0}.row{display:grid;grid-template-columns:44px minmax(0,1fr) 34px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.thumb{width:44px;height:44px;border-radius:12px;background:#f6eee8;display:grid;place-items:center;font-size:20px}.name{font-size:14px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:11px;color:var(--muted);margin-top:3px}.check{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:#fff;color:transparent}.check.on{background:var(--accent);border-color:var(--accent);color:white}.sticky{position:absolute;left:0;right:0;bottom:0;padding:12px 16px 18px;background:linear-gradient(transparent,var(--bg) 24%)}.phone-inner{position:relative;min-height:780px}.primary{width:100%;min-height:50px;border:0;border-radius:999px;background:var(--accent);color:white;font-weight:800;font-size:15px}.primary:disabled{background:#d9cec7}.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice{border:1px solid var(--line);background:#fff;border-radius:16px;padding:14px;text-align:left}.choice.active{border:2px solid var(--accent);background:var(--accent-soft)}.choice .icon{font-size:24px}.camera{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.camera button{min-height:86px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--muted)}.camera button.active{background:var(--accent-soft);border:2px solid var(--accent);color:var(--accent);font-weight:750}.hint{display:flex;gap:9px;padding:12px;border-radius:14px;background:#f7efe9;color:var(--muted);font-size:12px;line-height:1.5}.set{display:grid;grid-template-columns:30px 1fr 1fr 36px;gap:7px;align-items:center;margin-top:10px}.field{min-width:0;border:1px solid var(--line);background:white;border-radius:11px;padding:10px 8px;color:#a2948c}.reuse{display:flex;justify-content:space-between;align-items:center;padding:10px 0}.link{border:0;background:transparent;color:var(--accent);font-weight:750}.success{background:var(--ok);color:var(--ok-ink);padding:11px;border-radius:12px;font-weight:750}.label{font-size:12px;color:var(--muted);margin:14px 0 7px}.count{font-size:12px;color:var(--muted);margin:3px 0 5px}@media(max-width:720px){.stage{padding:0}.phone{border-radius:0;min-height:100dvh}.phone-inner{min-height:100dvh}}@media(prefers-reduced-motion:no-preference){button{transition:transform .16s ease,background .16s ease}button:active{transform:scale(.98)}}
  </style>
</head>
<body>
<main class="stage">
  <section class="phone"><div class="phone-inner"><header><div><h1>添加动作</h1><div class="sub">可连续选择多个动作</div></div><button class="link" onclick="clearAll()">清空</button></header><div class="content"><label class="search">⌕ <input id="q" placeholder="搜索动作或器械" oninput="renderList()"></label><div class="filters"><button class="chip active">全部器械</button><button class="chip">杠铃</button><button class="chip">哑铃</button><button class="chip">固定器械</button></div><div class="picker"><nav class="rail" id="rail"></nav><div class="list"><div class="count" id="count"></div><div id="exerciseList"></div></div></div></div><div class="sticky"><button class="primary" id="addButton" disabled>添加动作</button></div></div></section>
  <section class="phone"><div class="phone-inner"><header><div><h1>动作识别</h1><div class="sub">只显示模型当前支持的动作</div></div><span>1 / 3</span></header><div class="content"><div class="label">识别动作</div><div class="choice-grid" id="recognitionActions"></div><div class="label">拍摄机位</div><div class="camera"><button class="active" onclick="pickCamera(this)"><div>◩</div>侧前 45°</button><button onclick="pickCamera(this)"><div>▣</div>正侧面</button><button onclick="pickCamera(this)"><div>◎</div>正面</button></div><div class="hint" style="margin-top:12px"><b>拍摄提示</b><span>全身进入画面，镜头约髋部高度，动作期间保持机位固定。</span></div><div class="label">视频</div><div class="card"><b>尚未选择视频</b><div class="sub" style="margin-top:4px">支持 MP4、MOV、M4V、WebM</div></div></div><div class="sticky"><button class="primary">选择视频</button></div></div></section>
  <section class="phone"><div class="phone-inner"><header><div><h1>训练记录</h1><div class="sub">新建数据为空白，历史复用有明确来源</div></div><span>⋯</span></header><div class="content"><div class="card"><div class="reuse"><div><b>器械推胸</b><div class="sub">胸部 · 固定器械</div></div><button class="link" onclick="reuseLast()">带入上次</button></div><div class="set"><b>1</b><div class="field" id="weight">重量 kg</div><div class="field" id="reps">次数</div><button class="check">✓</button></div><button class="link" style="margin-top:10px">＋ 添加一组</button></div><div class="success">完成后整组变绿，并启动对应休息计时</div><div class="card" style="margin-top:12px"><b>训练完成总结</b><div class="choice-grid" style="margin-top:10px"><div><div class="sub">总容量</div><b>4,860 kg</b></div><div><div class="sub">完成组</div><b>12 / 12</b></div><div><div class="sub">训练时长</div><b>48 分钟</b></div><div><div class="sub">主要肌群</div><b>胸 · 肱三头</b></div></div></div><button class="primary" onclick="this.textContent='已发送今日训练给 AI'">发送今日训练给 AI</button></div></div></section>
</main>
<script>
const groups=['全部','胸','背','肩','腿','手臂','核心'];let group='全部';const picked=new Set();const actions=[['器械推胸','胸','固定器械'],['杠铃卧推','胸','杠铃'],['坐姿划船','背','固定器械'],['哑铃侧平举','肩','哑铃'],['高脚杯深蹲','腿','哑铃']];
function renderRail(){rail.innerHTML=groups.map(x=>`<button class="${x===group?'active':''}" onclick="group='${x}';renderRail();renderList()">${x}</button>`).join('')}
function renderList(){const needle=q.value.trim();const list=actions.filter(x=>(group==='全部'||x[1]===group)&&(!needle||x.join('').includes(needle)));count.textContent=`${list.length} 个动作`;exerciseList.innerHTML=list.map((x,i)=>`<div class="row"><div class="thumb">🏋</div><div><div class="name">${x[0]}</div><div class="meta">${x[1]} · ${x[2]}</div></div><button class="check ${picked.has(x[0])?'on':''}" onclick="toggle('${x[0]}')">✓</button></div>`).join('')}
function toggle(x){picked.has(x)?picked.delete(x):picked.add(x);addButton.disabled=!picked.size;addButton.textContent=picked.size?`添加 ${picked.size} 个动作`:'添加动作';renderList()}
function clearAll(){picked.clear();addButton.disabled=true;addButton.textContent='添加动作';renderList()}
function pickCamera(el){document.querySelectorAll('.camera button').forEach(x=>x.classList.remove('active'));el.classList.add('active')}
function reuseLast(){weight.textContent='上次 42.5';reps.textContent='上次 10'}
const supported=[['杠铃深蹲','正侧 / 侧后'],['臀推','正侧面'],['罗马尼亚硬拉','正侧 / 侧后'],['高位下拉','正后 / 正侧']];recognitionActions.innerHTML=supported.map((x,i)=>`<button class="choice ${i===0?'active':''}" onclick="document.querySelectorAll('.choice').forEach(y=>y.classList.remove('active'));this.classList.add('active')"><div class="icon">${i<3?'🏋':'💪'}</div><b>${x[0]}</b><div class="sub">推荐 ${x[1]}</div></button>`).join('');renderRail();renderList();
</script>
</body>
</html>

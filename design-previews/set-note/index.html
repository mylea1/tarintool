<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KILO 组备注交互预览</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; background:#fff8f2; color:#241711; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; }
    main { width:min(390px, calc(100vw - 28px)); }
    .card { background:white; border:1px solid #eadbd0; border-radius:18px; padding:14px; box-shadow:0 10px 30px #6b2e1012; }
    h1 { margin:0 0 4px; font-size:20px; } p { margin:0 0 14px; color:#806b60; font-size:13px; }
    .header,.set { display:grid; grid-template-columns:54px 48px 58px 42px 42px 42px; gap:4px; align-items:center; }
    .header { color:#8b756a; font-size:11px; padding:0 4px 5px; }
    .set { border:1px solid #e7d8ce; border-radius:12px; padding:5px 4px; }
    input { box-sizing:border-box; width:100%; min-width:0; height:38px; border:1px solid #ddc9bc; border-radius:9px; text-align:center; font-size:13px; }
    button { min-width:42px; min-height:42px; border:0; border-radius:10px; background:#fff0e6; color:#dd5314; font-size:20px; cursor:pointer; }
    button[data-filled="true"] { background:#e45a17; color:white; }
    dialog { width:min(340px, calc(100vw - 40px)); border:0; border-radius:18px; padding:18px; box-shadow:0 24px 70px #24171135; }
    dialog::backdrop { background:#24171155; }
    textarea { box-sizing:border-box; width:100%; min-height:110px; resize:vertical; border:1px solid #ddc9bc; border-radius:12px; padding:12px; font:inherit; }
    .actions { display:flex; justify-content:flex-end; gap:8px; margin-top:12px; }
    .actions button { width:auto; padding:0 16px; font-size:14px; }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <h1>杠铃卧推</h1>
      <p>组备注只在需要时展开，主表仍保持紧凑。</p>
      <div class="header"><span>组别</span><span>上次</span><span>kg</span><span>次数</span><span>备注</span><span>完成</span></div>
      <div class="set"><strong>1 正</strong><span>80×8</span><input value="82.5"><input value="8"><button id="note" aria-label="编辑第 1 组备注">▤</button><button aria-label="完成第 1 组">✓</button></div>
    </section>
  </main>
  <dialog id="editor">
    <h1>第 1 组备注</h1>
    <p>记录握距、动作感受、疼痛或器械设置。</p>
    <textarea id="text" placeholder="例如：窄握，最后两次速度变慢"></textarea>
    <div class="actions"><button id="cancel">取消</button><button id="save" data-filled="true">保存备注</button></div>
  </dialog>
  <script>
    const editor=document.querySelector('#editor'), note=document.querySelector('#note'), text=document.querySelector('#text');
    note.onclick=()=>editor.showModal(); document.querySelector('#cancel').onclick=()=>editor.close();
    document.querySelector('#save').onclick=()=>{ note.dataset.filled=String(Boolean(text.value.trim())); editor.close(); };
  </script>
</body>
</html>

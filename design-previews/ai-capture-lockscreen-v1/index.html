<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KILO 高频交互预览</title>
<style>:root{--bg:#fff8f2;--card:#fff;--ink:#2d1710;--muted:#806d64;--brand:#e65312;--green:#13734b;--line:#eadfd8}*{box-sizing:border-box}body{margin:0;background:#eee8e3;font:15px/1.45 system-ui,"PingFang SC",sans-serif;color:var(--ink)}main{max-width:1100px;margin:auto;padding:24px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.phone{min-width:0;min-height:650px;background:var(--bg);border:8px solid #211714;border-radius:34px;overflow:hidden;box-shadow:0 18px 50px #56341d26}header{padding:22px 18px 14px;font-size:23px;font-weight:850}.body{padding:10px 14px 22px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}h2{font-size:18px;margin:0 0 6px}.muted{color:var(--muted);font-size:13px}.answer{min-height:140px}.stream:after{content:"";display:inline-block;width:7px;height:18px;margin-left:3px;background:var(--brand);vertical-align:-4px;animation:blink .8s step-end infinite}@keyframes blink{50%{opacity:0}}.row{display:flex;gap:9px;align-items:center}.between{justify-content:space-between}.btn{border:0;border-radius:999px;background:var(--brand);color:#fff;padding:11px 17px;font-weight:750;cursor:pointer}.btn.secondary{background:#f8e6dc;color:var(--brand)}.btn.dark{background:#39231b}.btn:active{transform:scale(.97)}textarea{width:100%;min-height:135px;resize:vertical;border:1px solid var(--line);border-radius:14px;padding:12px;font:inherit;color:inherit;background:white}.set{display:grid;grid-template-columns:1fr auto auto;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}.lock{background:linear-gradient(165deg,#29211f,#6a5e5d);color:white;padding:70px 16px 20px;min-height:650px}.lock .card{color:var(--ink);padding:16px}.clock{text-align:center;font-size:44px;font-weight:250;margin-bottom:70px}.actions{display:grid;grid-template-columns:1.5fr 1fr;gap:8px;margin-top:14px}.actions button{min-height:48px}.chip{display:inline-flex;border-radius:999px;background:#f4eee9;padding:5px 9px;font-size:12px}.timer{font:800 25px ui-monospace,monospace}@media(max-width:850px){main{grid-template-columns:1fr;max-width:430px;padding:12px}.phone{min-height:590px}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<main><section class="phone"><header>AI 教练</header><div class="body"><div class="card"><div class="muted">你的问题</div><b>根据今天卧推表现，下一次重量怎么调整？</b></div><div class="card answer"><div class="row between"><span class="chip">已等待 <b id="elapsed">8</b> 秒</span><button class="btn secondary" onclick="cancel()">停止回答</button></div><p id="answer" class="stream">你今天完成了 4 组卧推，最后一组次数下降但动作备注没有出现明显失速。建议下一次先维持 80 kg，目标是</p></div><div class="muted">答案会逐字出现；停止后保留已经生成的内容。</div></div></section>
<section class="phone"><header>快速记训练</header><div class="body"><div class="card"><h2>像记备忘录一样输入</h2><p class="muted">支持“重量 × 次数 × 组数”或逐组次数。</p><textarea id="note">卧推 80kg 8,8,7 休息120秒&#10;高位下拉 50kg 10×3&#10;备注：最后一组接近力竭</textarea><button class="btn" style="width:100%;margin-top:10px" onclick="parseNote()">转换为结构化记录</button></div><div class="card" id="preview"><div class="muted">转换预览</div><div class="set"><b>卧推</b><span>80 kg</span><span>8 / 8 / 7</span></div><div class="set"><b>高位下拉</b><span>50 kg</span><span>10 × 3</span></div></div></div></section>
<section class="phone lock"><div class="clock">19:27</div><div class="card"><div class="row between"><div><h2>自由训练</h2><div class="muted">高位下拉 · 第 3/4 组</div></div><div class="timer" id="settime">00:38</div></div><div class="muted" style="margin-top:7px">本组用时 · 自动记录，可在设置中关闭</div><div class="actions"><button class="btn" onclick="completeSet(this)">完成本组</button><button class="btn dark" id="pause" onclick="togglePause()">暂停</button></div></div></section></main>
<script>let paused=false,secs=38;setInterval(()=>{if(!paused){secs++;document.querySelector('#settime').textContent=`${String(Math.floor(secs/60)).padStart(2,'0')}:${String(secs%60).padStart(2,'0')}`}},1000);function cancel(){document.querySelector('#answer').classList.remove('stream');document.querySelector('#elapsed').parentElement.textContent='已停止 · 保留当前内容'}function togglePause(){paused=!paused;document.querySelector('#pause').textContent=paused?'继续':'暂停'}function completeSet(b){b.textContent='已完成 ✓';b.style.background='#13734b'}function parseNote(){document.querySelector('#preview').animate([{transform:'translateY(5px)',opacity:.5},{transform:'none',opacity:1}],{duration:260})}</script></html>

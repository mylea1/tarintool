<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>形域 · 紧凑训练与 AI 入口预览</title>
  <style>
    :root{--paper:#fff8f2;--surface:#fff;--ink:#241a16;--muted:#78675f;--line:#eadbd1;--orange:#e9540d;--tint:#ffe7d7}
    *{box-sizing:border-box} body{margin:0;background:#e8e2de;font:14px/1.35 system-ui;color:var(--ink)}
    .phone{width:min(100%,414px);min-height:100vh;margin:auto;background:var(--paper);padding-bottom:70px}
    header{height:54px;display:flex;align-items:center;gap:9px;padding:0 14px;border-bottom:1px solid var(--line)}
    .logo{width:30px;height:30px;border-radius:50%;border:6px solid var(--ink);border-right-color:var(--orange)}
    h1{font-size:21px;margin:0}.tabs{display:flex;height:42px;border-bottom:1px solid var(--line)}
    .tab{flex:1;display:grid;place-items:center;font-weight:800}.tab.on{color:var(--orange);border-bottom:3px solid var(--orange)}
    main{padding:14px}.hero{display:grid;grid-template-columns:1fr 1fr;gap:8px}.button{border:1px solid var(--line);border-radius:999px;padding:11px 10px;text-align:center;font-weight:800;background:#fff}.button.primary{background:var(--orange);color:#fff;border-color:var(--orange)}
    .section{display:flex;align-items:end;justify-content:space-between;margin:18px 0 8px}.section h2{font-size:18px;margin:0}.section small{color:var(--muted)}
    .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:9px}
    .plan{display:flex;gap:10px;align-items:center}.thumb{width:44px;height:44px;border-radius:12px;background:var(--tint);display:grid;place-items:center;font-size:22px}.grow{flex:1;min-width:0}.grow b,.grow span{display:block}.grow span{color:var(--muted);font-size:12px}.types{display:flex;gap:7px;margin-top:10px}.type{width:42px;height:38px;border:1px solid var(--line);border-radius:10px;display:grid;place-items:center;color:var(--orange);font-size:18px}.rail{display:flex;gap:6px;overflow:auto;padding:2px 0 8px}.chip{white-space:nowrap;border:1px solid var(--line);border-radius:9px;padding:7px 9px;background:#fff}.chip.on{background:var(--tint);color:var(--orange);font-weight:800}
    .profile{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.quick{height:76px;padding:10px;display:flex;gap:8px;align-items:center}.quick i{width:32px;height:32px;border-radius:10px;background:var(--tint);display:grid;place-items:center;color:var(--orange);font-style:normal}.quick b,.quick small{display:block}.quick small{color:var(--muted)}
    nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,414px);height:62px;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;font-size:11px;font-weight:700}
    @media(max-width:340px){main{padding:11px}.profile{grid-template-columns:1fr}.hero{grid-template-columns:1fr}.phone{font-size:13px}}
  </style>
</head>
<body><div class="phone">
  <header><div class="logo"></div><h1>训练</h1></header>
  <div class="tabs"><div class="tab on">计划</div><div class="tab">记录</div></div>
  <main>
    <div class="hero"><div class="button primary">▶ 自由训练</div><div class="button">✦ AI 定制计划</div></div>
    <div class="section"><div><h2>我的计划</h2><small>计划与 AI 入口均在训练主页</small></div><b style="color:var(--orange)">新建</b></div>
    <div class="card plan"><div class="thumb">🏋</div><div class="grow"><b>胸肩训练</b><span>4 个动作 · 12 组</span></div><b>开始</b></div>
    <div class="rail"><span class="chip on">全部</span><span class="chip">固定器械</span><span class="chip">哑铃</span><span class="chip">杠铃</span><span class="chip">壶铃</span><span class="chip">史密斯机</span><span class="chip">绳索</span></div>
    <div class="section"><div><h2>组类型</h2><small>计划与实时训练共用图标选择器</small></div></div>
    <div class="card"><div class="types"><div class="type">🔥</div><div class="type">🏋</div><div class="type">↘</div><div class="type">↓</div><div class="type">⚠</div></div></div>
    <div class="section"><div><h2>我的</h2><small>减少卡片高度与无效留白</small></div></div>
    <div class="profile"><div class="card quick"><i>↗</i><div><b>训练进步</b><small>趋势与记录</small></div></div><div class="card quick"><i>⏱</i><div><b>组间休息</b><small>完成首组时设置</small></div></div><div class="card quick"><i>文</i><div><b>应用语言</b><small>简体中文</small></div></div><div class="card quick"><i>铃</i><div><b>通知反馈</b><small>已开启</small></div></div></div>
  </main>
  <nav><span>⌂<br>主页</span><span>🏋<br>训练</span><span>▤<br>动作</span><span>▢<br>AI</span><span>○<br>我的</span></nav>
</div></body></html>

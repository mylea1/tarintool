<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>休息编辑与动作卡片密度预览</title>
<style>
  :root{font-family:system-ui,-apple-system,"PingFang SC",sans-serif;color:#2b211b;background:#fff7f1}*{box-sizing:border-box}
  body{margin:0;padding:28px;display:grid;place-items:center}.phone{width:min(390px,100%);background:#fffaf6;border:1px solid #ead9cd;border-radius:32px;padding:18px;box-shadow:0 22px 70px #8e3d1522}
  h1{font-size:23px;margin:0 0 16px}.rest{background:#fff0e5;border:1px solid #efcdb8;border-radius:18px;padding:14px}.row{display:flex;align-items:center;gap:10px}.grow{flex:1}.eyebrow{font-size:12px;color:#785f50}.time{font-size:28px;font-weight:900;font-variant-numeric:tabular-nums}.button{border:0;border-radius:999px;padding:10px 13px;font-weight:750;background:#fff;color:#d84c10}.button.primary{background:#e85412;color:#fff}.scope{margin:10px 0 0;font-size:12px;color:#785f50}.actions{display:flex;gap:6px;justify-content:flex-end;margin-top:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.card{overflow:hidden;border:1px solid #ead9cd;border-radius:17px;background:#fff}.art{aspect-ratio:1.18;background:linear-gradient(145deg,#fff,#f4e4d7);display:grid;place-items:center;font-size:48px}.copy{padding:9px 10px 11px}.name{font-weight:850}.meta{font-size:12px;color:#785f50;margin-top:3px}.note{font-size:11px;color:#a24a20;margin-top:4px}
</style>
<body><main class="phone"><h1>训练中</h1><section class="rest"><div class="row"><span>⏱</span><div class="grow"><b>组间休息</b><div class="eyebrow">器械推胸</div></div><div class="time">00:53</div></div><div class="scope">修改后应用于当前倒计时，以及本次训练后续所有动作和未完成组</div><div class="actions"><button class="button">+15 秒</button><button class="button">跳过</button><button class="button primary">修改休息</button></div></section><section class="grid"><article class="card"><div class="art">🏋️</div><div class="copy"><div class="name">器械推胸</div><div class="meta">胸部 · 固定器械</div></div></article><article class="card"><div class="art">💪</div><div class="copy"><div class="name">器械卷腹</div><div class="meta">腹部 · 固定器械</div></div></article></section></main></body>
</html>

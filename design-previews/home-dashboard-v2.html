<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>形域 · 首页仪表盘 V2</title>
  <style>
    :root{--bg:#fff7f0;--paper:#fff;--ink:#261a15;--muted:#806f66;--line:#ead8cb;--orange:#e65313;--orange-soft:#ffe4d3;--green:#1a9561;--shadow:0 12px 30px #6e34120f}
    *{box-sizing:border-box}body{margin:0;background:#eee7e1;color:var(--ink);font-family:system-ui,-apple-system,"PingFang SC",sans-serif}.shell{width:min(100%,430px);min-height:100dvh;margin:auto;background:var(--bg);padding:18px 16px 100px;overflow-x:hidden}.top{display:flex;align-items:center;gap:12px;margin:6px 0 20px}.logo{width:48px;height:48px;border-radius:50%;object-fit:cover}.top h1{margin:0;font-size:27px}.bell{margin-left:auto;border:0;background:transparent;font-size:25px;min-width:44px;min-height:44px}.card{background:var(--paper);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}.hero{padding:18px;overflow:hidden}.hero-top{display:grid;grid-template-columns:minmax(0,1fr) 124px;gap:8px}.eyebrow{font-size:13px;font-weight:850;color:var(--orange);letter-spacing:.04em}.hero h2{font-size:31px;line-height:1.1;margin:10px 0 9px;overflow-wrap:anywhere}.meta{color:var(--muted);line-height:1.7;font-size:14px}.hero img{width:124px;height:148px;object-fit:contain;align-self:end}.primary{width:100%;border:0;border-radius:16px;background:var(--orange);color:white;font-weight:850;font-size:17px;min-height:52px;margin-top:15px}.text-button{width:100%;border:0;background:transparent;min-height:44px;font-weight:750;color:var(--ink)}.section{margin-top:16px}.section-head{display:flex;align-items:center;gap:12px;margin:0 2px 9px}.section-head h2{font-size:20px;margin:0}.section-head strong{margin-left:auto;color:var(--orange)}.week{padding:14px 10px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.day{border:0;background:transparent;min-width:0;padding:4px 0;color:var(--muted)}.day b,.day span{display:block}.day b{font-size:13px}.day span{width:30px;height:30px;border-radius:50%;margin:7px auto 0;display:grid;place-items:center;border:1px solid var(--line);font-size:13px}.day.done span{background:var(--orange-soft);border-color:transparent;color:var(--orange)}.day.today span{background:var(--orange);color:white;border-color:var(--orange)}.insights{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}.mini{padding:14px;min-width:0}.mini-title{display:flex;align-items:center;gap:6px;font-weight:850}.mini-title button{margin-left:auto;border:0;background:transparent;color:var(--orange);font:inherit;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bodies{display:flex;justify-content:center;gap:7px;height:145px;margin-top:8px}.body{position:relative;width:58px;height:135px;background:linear-gradient(#f8eee8,#fff);border-radius:28px 28px 18px 18px}.body:before{content:"";position:absolute;left:20px;top:5px;width:19px;height:19px;border-radius:50%;background:#decfc6}.body i{position:absolute;background:#f3743a;border-radius:10px}.body .chest{left:10px;right:10px;top:34px;height:22px}.body .shoulder{left:4px;right:4px;top:29px;height:13px;background:#ef935f}.body .arm{left:4px;right:4px;top:58px;height:9px;background:#ffc0a2}.body.back .chest{top:35px;height:40px;background:#f59a6b}.legend{font-size:11px;color:var(--muted);text-align:center}.metric{font-size:28px;font-weight:900;margin:12px 0 0;white-space:nowrap}.delta{color:var(--green);font-weight:800;font-size:12px}.chart{width:100%;height:112px;margin-top:5px;overflow:visible}.chart text{font-size:9px;fill:var(--muted)}.chart .grid{stroke:#eee2da;stroke-width:1}.chart .line{fill:none;stroke:var(--orange);stroke-width:3}.chart circle{fill:white;stroke:var(--orange);stroke-width:2}.ai{padding:14px;display:flex;align-items:center;gap:12px;border:1px solid var(--line);width:100%;text-align:left}.ai .icon{width:44px;height:44px;border-radius:14px;background:var(--orange-soft);display:grid;place-items:center;color:var(--orange);font-weight:900}.ai b,.ai small{display:block}.ai small{color:var(--muted);margin-top:4px;overflow-wrap:anywhere}.ai .arrow{margin-left:auto}.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,430px);height:82px;background:white;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:7px 8px 14px}.nav button{border:0;background:transparent;color:var(--ink);font-size:12px}.nav button span{display:block;font-size:23px;margin-bottom:3px}.nav .active{color:var(--orange);background:var(--orange-soft);border-radius:18px}dialog{border:0;border-radius:24px;padding:0;width:min(92vw,390px);box-shadow:0 30px 80px #32180d4d}dialog::backdrop{background:#261a1566}.sheet{padding:20px}.sheet h2{margin:0 0 6px}.sheet p{color:var(--muted)}.sheet label{display:block;font-weight:750;margin:14px 0 6px}.sheet input,.sheet select{width:100%;min-height:48px;border:1px solid var(--line);border-radius:12px;padding:10px;font:inherit}.close{border:0;background:#f4ebe5;min-height:46px;border-radius:13px;width:100%;font-weight:800;margin-top:10px}
    @media(max-width:350px){.shell{padding-left:12px;padding-right:12px}.hero-top{grid-template-columns:minmax(0,1fr) 92px}.hero img{width:92px;height:130px}.hero h2{font-size:27px}.insights{grid-template-columns:1fr}.bodies{height:130px}.mini{padding:12px}}
    @media(min-width:600px){.shell{width:768px;max-width:100%;padding-left:42px;padding-right:42px}.nav{width:768px}.insights{grid-template-columns:1fr 1.35fr}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
  </style>
</head>
<body>
<main class="shell">
  <header class="top"><img class="logo" src="../mobile/assets/branding/xingyu-mark.png" alt="形域"><h1>主页</h1><button class="bell" aria-label="通知">♧</button></header>
  <section class="card hero" aria-label="今日训练">
    <div class="hero-top"><div><div class="eyebrow">今日训练</div><h2>上肢力量 A</h2><div class="meta">胸 · 肩 · 三头<br>预计 55 分钟</div></div><img src="../mobile/assets/exercises/shoulder_press_0.png" alt="肩推动作"></div>
    <button class="primary" id="start">开始今日训练</button><button class="text-button">调整计划 ›</button>
  </section>
  <section class="section"><div class="section-head"><h2>本周训练</h2><strong>3 / 4 次</strong></div><div class="card week"><button class="day done"><b>一</b><span>✓</span></button><button class="day done"><b>二</b><span>✓</span></button><button class="day done"><b>三</b><span>✓</span></button><button class="day today"><b>四</b><span>今</span></button><button class="day"><b>五</b><span>·</span></button><button class="day"><b>六</b><span>·</span></button><button class="day"><b>日</b><span>·</span></button></div></section>
  <section class="section insights">
    <article class="card mini"><div class="mini-title">本周肌群 <span style="margin-left:auto;color:var(--muted)">›</span></div><div class="bodies"><div class="body"><i class="shoulder"></i><i class="chest"></i><i class="arm"></i></div><div class="body back"><i class="shoulder"></i><i class="chest"></i><i class="arm"></i></div></div><div class="legend">高强度 · 胸肩三头</div></article>
    <article class="card mini" id="trend"><div class="mini-title"><button id="exercise" aria-haspopup="dialog">卧推趋势⌄</button></div><div class="metric" id="weight">82.5 kg</div><div class="delta" id="delta">较上次 +2.5 kg</div><svg class="chart" viewBox="0 0 190 100" role="img" aria-label="动作重量趋势"><path class="grid" d="M8 20H182M8 50H182M8 80H182"/><path class="line" id="line" d="M12 79 L54 65 L96 54 L138 40 L178 24"/><g id="dots"><circle cx="12" cy="79" r="4"/><circle cx="54" cy="65" r="4"/><circle cx="96" cy="54" r="4"/><circle cx="138" cy="40" r="4"/><circle cx="178" cy="24" r="5"/></g><text x="8" y="96">4/18</text><text x="82" y="96">5/2</text><text x="158" y="96">5/15</text></svg></article>
  </section>
  <section class="section"><button class="card ai" id="ai"><span class="icon">AI</span><span><b>AI 定制训练</b><small>按目标、器械和时间生成计划</small></span><span class="arrow">›</span></button></section>
</main>
<nav class="nav" aria-label="主导航"><button class="active"><span>⌂</span>主页</button><button><span>⌁</span>训练</button><button><span>♜</span>动作</button><button><span>AI</span>AI</button><button><span>♙</span>我的</button></nav>
<dialog id="trendDialog"><form method="dialog" class="sheet"><h2>选择趋势动作</h2><p>只比较你自己的同一个动作历史。</p><label for="trendSelect">动作</label><select id="trendSelect"><option value="bench">杠铃卧推</option><option value="pulldown">高位下拉</option><option value="squat">杠铃深蹲</option></select><button class="primary" value="apply">查看趋势</button><button class="close" value="cancel">取消</button></form></dialog>
<dialog id="aiDialog"><form method="dialog" class="sheet"><h2>AI 定制训练</h2><p>填写训练目标后直接生成计划，不跳转到聊天页。</p><label>目标肌群</label><input value="胸 · 肩 · 三头"><label>可用时间</label><select><option>45 分钟</option><option selected>60 分钟</option><option>90 分钟</option></select><button class="primary">生成训练计划</button><button class="close">取消</button></form></dialog>
<script>
  const data={bench:{name:'卧推趋势',weight:'82.5 kg',delta:'较上次 +2.5 kg',path:'M12 79 L54 65 L96 54 L138 40 L178 24'},pulldown:{name:'高位下拉趋势',weight:'65 kg',delta:'较上次 +5 kg',path:'M12 75 L54 68 L96 58 L138 46 L178 30'},squat:{name:'深蹲趋势',weight:'100 kg',delta:'较上次 +0 kg',path:'M12 70 L54 52 L96 58 L138 39 L178 39'}};
  const trendDialog=document.querySelector('#trendDialog');document.querySelector('#exercise').onclick=()=>trendDialog.showModal();trendDialog.addEventListener('close',()=>{if(trendDialog.returnValue!=='apply')return;const d=data[document.querySelector('#trendSelect').value];exercise.textContent=d.name+'⌄';weight.textContent=d.weight;delta.textContent=d.delta;line.setAttribute('d',d.path)});
  document.querySelector('#ai').onclick=()=>document.querySelector('#aiDialog').showModal();document.querySelector('#start').onclick=e=>{e.currentTarget.textContent='继续今日训练';e.currentTarget.style.background='#1a9561'};
</script>
</body></html>

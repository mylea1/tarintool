<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>炽练 AI 计划与日历状态预览</title>
  <style>
    :root{color-scheme:light;--bg:#fff8f3;--surface:#fff;--ink:#241a15;--muted:#756156;--line:#ead9cd;--orange:#d95718;--orange-soft:#ffe3d2;--green:#18794e;--green-soft:#dff4e8;--blue:#2468c9;--blue-soft:#e8f1ff;--shadow:0 14px 36px rgba(99,45,15,.12)}
    *{box-sizing:border-box} body{margin:0;background:#efe9e4;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;color:var(--ink)}
    button{font:inherit}.stage{display:grid;grid-template-columns:repeat(2,minmax(0,390px));gap:24px;justify-content:center;padding:24px}.phone{min-height:780px;background:var(--bg);border-radius:34px;box-shadow:var(--shadow);overflow:hidden;border:1px solid #e8d7ca}.bar{padding:22px 20px 12px;font-size:20px;font-weight:850}.content{padding:0 16px 24px}.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}.metric{background:#fff4ec;border-radius:12px;padding:10px}.metric b{display:block;font-size:18px;margin-top:3px}.muted{color:var(--muted);font-size:12px}.exercise{border-top:1px solid var(--line);padding-top:13px;margin-top:13px}.exercise-head{display:flex;gap:10px;align-items:center}.thumb{width:48px;height:48px;border-radius:12px;background:var(--orange-soft);display:grid;place-items:center;font-size:24px}.grow{min-width:0;flex:1}.title{font-weight:850}.chip{font-size:11px;padding:4px 8px;background:var(--orange-soft);color:#8e350e;border-radius:999px}.sets{display:grid;grid-template-columns:28px 1fr 1fr 1fr;gap:6px;margin-top:9px;font-size:12px;align-items:center}.sets span{background:#fff8f3;border-radius:8px;padding:8px 5px;text-align:center}.primary,.secondary{width:100%;border-radius:14px;min-height:48px;font-weight:800}.primary{border:0;background:var(--orange);color:white}.secondary{border:1px solid var(--line);background:white;color:var(--ink);margin-top:8px}.date-row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff4ec;border:1px solid #f4cbb3;border-radius:14px;padding:12px;margin:12px 0}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:10px}.day{min-width:0;min-height:57px;border:1px solid var(--line);background:#fff;border-radius:11px;padding:6px 3px;text-align:center;position:relative}.day strong{display:block;font-size:13px}.day small{display:block;font-size:10px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.day.completed{background:var(--green-soft);border-color:var(--green);color:#0f5e3b}.day.scheduled{background:var(--orange-soft);border:2px solid var(--orange);color:#8a310c}.day.selected{background:var(--blue-soft);border:2px solid var(--blue);color:#174f9b}.legend{display:flex;flex-wrap:wrap;gap:12px;margin:12px 0 18px;font-size:12px}.legend span{display:flex;align-items:center;gap:5px}.swatch{width:12px;height:12px;border-radius:4px;border:1px solid}.refs{display:flex;align-items:flex-start;gap:8px;border-top:1px solid var(--line);padding:10px 0}.copy{border:0;background:var(--orange-soft);color:#983b12;border-radius:10px;min-width:44px;min-height:44px}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);opacity:0;background:#241a15;color:white;padding:10px 16px;border-radius:12px;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    @media(max-width:820px){.stage{grid-template-columns:minmax(0,414px);padding:10px}.phone{border-radius:24px}.summary{grid-template-columns:repeat(3,minmax(0,1fr))}}
    @media(max-width:340px){.stage{padding:0}.phone{border-radius:0}.summary{grid-template-columns:1fr}.sets{grid-template-columns:24px 1fr 1fr 1fr}.calendar{gap:3px}.day{min-height:54px}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <main class="stage">
    <section class="phone" aria-label="AI 计划详情">
      <header class="bar">今日练胸</header>
      <div class="content">
        <article class="card">
          <div class="title">AI 训练计划</div><div class="muted">先核对动作与计划重量，再选择训练日期</div>
          <div class="summary"><div class="metric"><span class="muted">动作</span><b>3</b></div><div class="metric"><span class="muted">工作组</span><b>10</b></div><div class="metric"><span class="muted">计划容量</span><b>3,920 kg</b></div></div>
          <div class="exercise"><div class="exercise-head"><div class="thumb">▣</div><div class="grow"><div class="title">杠铃卧推</div><div class="muted">胸 · 杠铃</div></div><span class="chip">4 组</span></div><div class="sets"><b>组</b><b>重量</b><b>次数</b><b>休息</b><span>1</span><span>40 kg</span><span>10</span><span>90 秒</span><span>2</span><span>60 kg</span><span>8</span><span>120 秒</span><span>3</span><span>60 kg</span><span>8</span><span>120 秒</span></div></div>
          <div class="exercise"><div class="exercise-head"><div class="thumb">◩</div><div class="grow"><div class="title">上斜哑铃卧推</div><div class="muted">上胸 · 哑铃</div></div><span class="chip">3 组</span></div><div class="sets"><b>组</b><b>重量</b><b>次数</b><b>休息</b><span>1</span><span>20 kg</span><span>10</span><span>90 秒</span><span>2</span><span>22.5 kg</span><span>8</span><span>90 秒</span></div></div>
        </article>
        <div class="date-row"><div><div class="title">安排到日历</div><div class="muted" id="selectedDate">2026 年 8 月 12 日 · 周三</div></div><button class="copy" id="changeDate" aria-label="更换日期">改期</button></div>
        <button class="primary" id="save">保存到 8 月 12 日</button><button class="secondary">仅保存计划</button>
      </div>
    </section>
    <section class="phone" aria-label="训练日历">
      <header class="bar">训练日历</header>
      <div class="content">
        <article class="card"><div class="title">2026 年 8 月</div><div class="calendar" id="calendar"></div><div class="legend"><span><i class="swatch" style="background:var(--green-soft);border-color:var(--green)"></i>已完成</span><span><i class="swatch" style="background:var(--orange-soft);border-color:var(--orange)"></i>已安排</span><span><i class="swatch" style="background:var(--blue-soft);border-color:var(--blue)"></i>当前选中</span><span><i class="swatch" style="background:#fff;border-color:var(--line)"></i>未安排</span></div></article>
        <article class="card"><div class="title">参考文献</div><div class="refs"><div class="grow"><b>ACSM 阻力训练建议</b><div class="muted">https://example.com/acsm</div></div><button class="copy" data-copy="ACSM 阻力训练建议 https://example.com/acsm" aria-label="复制参考文献">复制</button></div><div class="refs"><div class="grow"><b>渐进超负荷实践</b><div class="muted">知识库 · 训练原则</div></div><button class="copy" data-copy="渐进超负荷实践" aria-label="复制参考文献">复制</button></div></article>
      </div>
    </section>
  </main>
  <div class="toast" id="toast" role="status">已复制</div>
  <script>
    const cal=document.querySelector('#calendar');const states={3:['completed','背 ✓'],6:['completed','腿 ✓'],12:['scheduled','胸'],15:['selected','选中'],18:['scheduled','肩']};for(let i=1;i<=28;i++){const [state='',label='']=states[i]||[];const b=document.createElement('button');b.className='day '+state;b.innerHTML=`<strong>${i}</strong><small>${label||' '}</small>`;cal.append(b)}
    const toast=document.querySelector('#toast');const flash=t=>{toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1200)};document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{await navigator.clipboard?.writeText(b.dataset.copy);flash('参考文献已复制')});document.querySelector('#changeDate').onclick=()=>flash('日期选择器已打开');document.querySelector('#save').onclick=()=>flash('计划已保存并安排到 8 月 12 日');
  </script>
</body>
</html>

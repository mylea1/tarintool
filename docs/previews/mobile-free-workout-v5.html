<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KILO v5 预览</title>
<style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#172532;background:#eaf1f6;--b:#0871da;--l:#d6e1e9;--q:#687a88}*{box-sizing:border-box}body{margin:0}.phone{width:min(100%,414px);min-height:100dvh;margin:auto;background:#f7fafc;padding:12px 14px 92px;overflow:hidden}.top{height:48px;display:flex;align-items:center;gap:8px}.top strong{font-size:20px}.grow{flex:1}button,input{font:inherit}button{min-height:44px;border:1px solid var(--l);border-radius:10px;background:white;padding:0 12px}button.primary{background:var(--b);color:white;border-color:var(--b)}.section{margin-top:14px}.section h2{font-size:17px;margin:0 0 8px}.overview,.card{background:white;border:1px solid var(--l);border-radius:14px;padding:12px}.overview{display:grid;grid-template-columns:1fr auto;gap:8px}.muted{font-size:12px;color:var(--q)}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.day{min-width:0;text-align:center;background:white;border:1px solid var(--l);border-radius:9px;padding:7px 2px;font-size:11px}.day b{display:block;font-size:14px;margin-top:3px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:7px}.metric{background:white;border:1px solid var(--l);border-radius:11px;padding:10px}.metric b{display:block;margin-top:4px}.empty{color:var(--q);font-size:12px}.bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,414px);padding:10px 14px 16px;background:#f7fafcef;border-top:1px solid var(--l);display:grid;grid-template-columns:1fr 1fr;gap:8px}.exercise{background:white;border:1px solid var(--l);border-radius:14px;margin-top:10px;overflow:hidden}.exhead{padding:10px 12px;display:flex;align-items:center;gap:8px}.thumb{width:44px;height:44px;border-radius:9px;background:linear-gradient(145deg,#dcecff,#f5f9fc);display:grid;place-items:center;font-size:20px}.rest{font-size:12px;color:var(--b)}.zero{text-align:center;padding:18px;border-top:1px solid #edf2f5}.zero p{font-size:12px;color:var(--q);margin:0 0 8px}dialog{border:0;padding:0;border-radius:18px;width:min(calc(100% - 18px),400px);max-height:88dvh}dialog::backdrop{background:#14243488}.picker{padding:12px;display:flex;flex-direction:column;max-height:88dvh}.picker header{display:flex;align-items:center}.picker h2{font-size:18px;margin:0}.search{width:100%;min-height:44px;border:1px solid var(--l);border-radius:10px;padding:0 12px;margin:10px 0}.chips{display:flex;gap:6px;overflow:auto;padding-bottom:8px}.chip{white-space:nowrap;min-height:36px}.chip.on{color:white;background:var(--b)}.list{overflow:auto}.item{display:grid;grid-template-columns:48px minmax(0,1fr) 44px;align-items:center;gap:9px;padding:8px 0;border-top:1px solid #edf2f5}.item b,.item small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.item small{color:var(--q);margin-top:3px}.burst{position:fixed;pointer-events:none;top:48px;left:50%;width:min(100%,414px);height:150px;transform:translateX(-50%);display:none;z-index:4}.burst.show{display:block}.p{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--b);animation:pop .8s ease-out forwards}.p:nth-child(2n){background:#76cf33}.p:nth-child(3n){background:#ffb72d}@keyframes pop{from{transform:translate(0,0) scale(.3);opacity:1}to{transform:translate(var(--x),var(--y)) scale(1);opacity:0}}@media(max-width:340px){.metrics{grid-template-columns:1fr}.overview{grid-template-columns:1fr}.overview button{width:100%}}@media(prefers-reduced-motion:reduce){.p{animation:none}.burst.show{display:none}}
</style></head><body><main class="phone"><div class="top"><strong>KILO · 主页</strong><span class="grow"></span><button aria-label="通知">◉</button></div><section class="overview"><div><b>准备开始训练</b><div class="muted">自由记录，或从计划开始</div></div><button class="primary" id="free">开始</button></section><section class="section"><h2>训练周</h2><div class="week"><div class="day">一<b>3</b></div><div class="day">二<b>4</b></div><div class="day">三<b>5</b></div><div class="day">四<b>6</b></div><div class="day">五<b>7</b></div><div class="day">六<b>8</b></div><div class="day">日<b>9</b></div></div></section><section class="section"><h2>进步摘要</h2><div class="metrics"><div class="metric"><span class="muted">训练量</span><b>暂无数据</b></div><div class="metric"><span class="muted">有效组</span><b>暂无数据</b></div></div></section><section class="section"><h2>最近记录</h2><div class="card empty">完成训练后，这里显示最近三条真实记录。</div></section><section id="work" class="section" hidden><h2>自由训练</h2><div class="exercise"><div class="exhead"><div class="thumb">🏋</div><div class="grow"><b>杠铃卧推</b><div class="rest">休息 0 秒 · 点击设置</div></div><button aria-label="更多">⋯</button></div><div class="zero"><p>尚未添加组数</p><button id="firstSet">＋ 添加第一组</button></div></div></section></main><div class="bottom"><button id="add">＋ 动作</button><button class="primary" id="done">完成一组</button></div><div id="burst" class="burst"></div><dialog id="picker"><div class="picker"><header><h2 class="grow">选择动作</h2><button onclick="picker.close()">×</button></header><input class="search" placeholder="搜索动作、英文名或器械"><div class="chips"><button class="chip on">全部</button><button class="chip">胸部</button><button class="chip">背部</button><button class="chip">肩部</button><button class="chip">腿部</button><button class="chip">手臂</button></div><div class="list"><div class="item"><div class="thumb">🏋</div><div><b>杠铃卧推</b><small>胸部 · 杠铃</small></div><button class="primary" onclick="choose()">＋</button></div><div class="item"><div class="thumb">💪</div><div><b>上斜哑铃卧推</b><small>胸部 · 哑铃</small></div><button class="primary">＋</button></div><div class="item"><div class="thumb">↔</div><div><b>坐姿划船</b><small>背部 · 器械</small></div><button class="primary">＋</button></div></div></div></dialog><script>add.onclick=()=>picker.showModal();free.onclick=()=>{work.hidden=false;work.scrollIntoView({behavior:'smooth'})};function choose(){picker.close();work.hidden=false;work.scrollIntoView({behavior:'smooth'})}done.onclick=()=>{burst.innerHTML='';for(let i=0;i<22;i++){let p=document.createElement('i');p.className='p';p.style.left=(45+Math.random()*10)+'%';p.style.top='60px';p.style.setProperty('--x',(Math.random()*260-130)+'px');p.style.setProperty('--y',(Math.random()*100-60)+'px');burst.appendChild(p)}burst.classList.remove('show');void burst.offsetWidth;burst.classList.add('show');setTimeout(()=>burst.classList.remove('show'),850)};firstSet.onclick=()=>firstSet.textContent='第 1 组 · 0 kg · 0 次';</script></body></html>

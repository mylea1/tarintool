<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KILO v4 交互预览</title>
<style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#172532;background:#edf3f7;--blue:#096fd8;--line:#d5e0e8}*{box-sizing:border-box}body{margin:0}.phone{width:min(100%,414px);min-height:100dvh;margin:auto;background:#f7fafc;padding:12px 14px 90px}.bar{display:flex;align-items:center;gap:8px;height:48px}.bar strong{font-size:19px}.bar button{margin-left:auto}.tabs{display:grid;grid-template-columns:1fr 1fr;background:#e8eef3;border-radius:10px;padding:3px}.tabs button{border:0;background:transparent;padding:9px;border-radius:8px}.tabs .on{background:white;color:var(--blue);box-shadow:0 1px 4px #6782a326}.summary{display:flex;align-items:center;gap:10px;margin:14px 0}.timer{font-variant-numeric:tabular-nums;font-size:22px;font-weight:750}.summary small{color:#687987}.grow{flex:1}button{font:inherit;min-height:44px;border:1px solid var(--line);background:white;border-radius:10px;padding:0 12px;color:#172532}button.primary{background:var(--blue);color:white;border-color:var(--blue)}.empty{border:1px dashed #aebdca;border-radius:14px;padding:24px 14px;text-align:center;background:white}.empty .icon{font-size:30px}.empty p{margin:6px 0 14px;color:#697b89;font-size:13px}.exercise{margin-top:12px;border:1px solid var(--line);border-radius:14px;background:white;overflow:hidden}.exhead{display:flex;align-items:center;gap:8px;padding:10px 12px}.exhead strong{font-size:15px}.iconbtn{width:44px;padding:0;font-size:18px}.set{display:grid;grid-template-columns:26px minmax(0,1fr) minmax(0,.72fr) 44px;gap:6px;padding:7px 10px;border-top:1px solid #edf1f4;align-items:center}.field{min-width:0;border:1px solid #cbd7e0;border-radius:8px;padding:7px 8px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.field b{font-weight:500;color:#637482}.bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,414px);display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 14px 16px;background:#f7fafcee;border-top:1px solid var(--line);backdrop-filter:blur(10px)}dialog{width:min(calc(100% - 24px),390px);border:0;border-radius:16px;padding:0;box-shadow:0 16px 60px #12263b44}dialog::backdrop{background:#14233380}.editor{padding:12px}.editor header{display:flex;align-items:center;gap:8px}.editor h2{font-size:19px;margin:0}.compact{display:grid;grid-template-columns:1.2fr .8fr .7fr;gap:6px;margin-top:8px}.compact .field{white-space:normal}.note{font-size:12px;color:#687987}@media(max-width:340px){.set{grid-template-columns:24px minmax(0,1fr) 44px}.set .reps{grid-column:2}.compact{grid-template-columns:1fr 1fr}.compact .type{grid-column:1/-1}}
</style>
</head>
<body><main class="phone"><div class="bar"><strong>KILO · 训练</strong><button class="iconbtn" aria-label="更多">⋯</button></div><div class="tabs"><button class="on">正在训练</button><button>计划</button></div><section class="summary"><div><div class="timer" id="elapsed">00:00</div><small>本次训练</small></div><div class="grow"></div><button id="edit">编辑计划预览</button></section><section id="empty" class="empty"><div class="icon">＋</div><strong>边练边记录</strong><p>无需提前创建计划，计时已经开始。</p><button class="primary" id="add">添加第一个动作</button></section><section id="exercise" class="exercise" hidden><div class="exhead"><strong class="grow">杠铃卧推</strong><button class="iconbtn" title="添加一组" id="addset">＋</button><button class="iconbtn" title="更多">⋯</button></div><div id="sets"><div class="set"><span>1</span><div class="field"><b>重量</b> 20 kg</div><div class="field reps"><b>次数</b> 8</div><button class="iconbtn" aria-label="完成">✓</button></div></div></section></main><div class="bottom"><button id="addbottom">＋ 动作</button><button class="primary">结束训练</button></div><dialog id="dialog"><div class="editor"><header><button class="iconbtn" onclick="dialog.close()">‹</button><h2 class="grow">编辑计划</h2><button class="primary" onclick="dialog.close()">保存</button></header><p class="note">完整页面草稿，返回不会修改原计划</p><div class="exercise"><div class="exhead"><strong class="grow">杠铃卧推</strong><button class="iconbtn">↕</button><button class="iconbtn">⌫</button></div><div class="compact"><div class="field type"><b>组别</b><br>正式组</div><div class="field"><b>计划</b><br>80 kg</div><div class="field"><b>次数</b><br>8</div></div><div class="compact"><div class="field"><b>休息</b><br>150 秒</div><button>＋ 一组</button></div></div></div></dialog>
<script>let t=0;setInterval(()=>{t++;elapsed.textContent=String(t/60|0).padStart(2,'0')+':'+String(t%60).padStart(2,'0')},1000);function show(){empty.hidden=true;exercise.hidden=false}add.onclick=show;addbottom.onclick=show;edit.onclick=()=>dialog.showModal();addset.onclick=()=>sets.insertAdjacentHTML('beforeend','<div class="set"><span>'+ (sets.children.length+1) +'</span><div class="field"><b>重量</b> 0 kg</div><div class="field reps"><b>次数</b> 8</div><button class="iconbtn">✓</button></div>')</script></body></html>

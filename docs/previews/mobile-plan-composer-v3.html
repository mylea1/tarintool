<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KILO 计划编排预览</title><style>
:root{--paper:#f3f6f8;--white:#fff;--ink:#10212b;--muted:#708494;--line:#d5e0e7;--blue:#0b66d4;--soft:#e7f1fb}*{box-sizing:border-box}body{margin:0;background:#dfe7ec;color:var(--ink);font:15px/1.4 system-ui,"Segoe UI","Noto Sans SC",sans-serif}.phone{width:min(100%,414px);min-height:100dvh;margin:auto;background:var(--paper);padding-bottom:80px}.top{height:58px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--line);background:var(--paper)}.brand{color:var(--blue);font-size:12px;font-weight:900;letter-spacing:.18em;margin-right:9px}.top h1{font-size:20px;margin:0}.tabs{display:flex;height:44px;border-bottom:1px solid var(--line);padding:0 16px;gap:26px}.tabs button{position:relative;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:800;padding:0 3px}.tabs button.active{color:var(--ink)}.tabs button.active:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--blue)}main{padding:14px 14px 24px}.title{display:flex;gap:8px;align-items:center}.name{min-width:0;flex:1;border:0;border-bottom:1px solid var(--line);background:transparent;padding:9px 3px;font:700 20px/1.2 inherit;color:var(--ink)}.quiet{color:var(--muted);font-size:12px}.exercise{margin-top:12px;background:var(--white);border:1px solid var(--line);border-radius:14px;overflow:hidden}.exercise-head{display:flex;align-items:center;gap:10px;padding:10px}.thumb{width:46px;height:46px;border-radius:10px;background:var(--soft);display:grid;place-items:center;font-size:22px}.exercise-head main{padding:0;min-width:0;flex:1}.exercise-head h2{font-size:16px;margin:0}.tools{display:flex;gap:3px;padding:7px 9px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.tools button{border:0;background:transparent;color:var(--muted);min-width:38px;min-height:38px}.rest{margin-left:auto;display:flex;align-items:center;gap:4px}.rest input{width:48px}.sets{padding:7px 9px}.set{padding:8px 0;border-bottom:1px solid #e9eef1}.set:last-child{border:0}.set-top,.set-bottom{display:flex;align-items:center;gap:7px}.set-top b{width:22px}.select,.field{border:1px solid var(--line);border-radius:9px;background:#f8fafb;min-height:38px;padding:7px 9px;color:var(--ink)}.select{flex:1}.delete{border:0;background:transparent;color:#b83a3a;min-width:38px;min-height:38px}.set-bottom{margin:6px 0 0 29px}.field{min-width:0;flex:1}.field span{display:block;color:var(--muted);font-size:10px}.add{width:100%;margin-top:10px;min-height:44px;border:1px dashed #9fb3c1;border-radius:11px;background:transparent;color:var(--blue);font-weight:800}.save{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,414px);padding:9px 14px calc(9px + env(safe-area-inset-bottom));background:var(--paper);border-top:1px solid var(--line)}.save button{width:100%;min-height:48px;border:0;border-radius:12px;background:var(--blue);color:#fff;font:800 16px inherit}.detail{display:none}.detail.show{display:block}.composer.hide{display:none}.history{display:flex;gap:8px;align-items:center;padding:10px;background:#fff;border:1px solid var(--line);border-radius:12px;margin-top:10px}.history .thumb{width:40px;height:40px}.weight{margin-left:auto;text-align:right}.delta{color:var(--blue);font-weight:800}@media(min-width:390px){.set{display:grid;grid-template-columns:1.35fr 1fr;gap:8px}.set-bottom{margin:0}.set-top b{width:20px}}
</style></head><body><section class="phone"><header class="top"><span class="brand">KILO</span><h1>训练</h1></header><nav class="tabs"><button class="active">计划</button><button id="records">记录</button></nav><main class="composer" id="composer"><div class="title"><input class="name" value="上肢力量 A" aria-label="训练名称"><span class="quiet">2 个动作</span></div><article class="exercise"><div class="exercise-head"><div class="thumb">🏋️</div><main><h2>杠铃卧推</h2><div class="quiet">3 组 · 休息 150 秒</div></main><button class="delete">⌄</button></div><div class="tools"><button>↑</button><button>↓</button><button>替换</button><div class="rest"><span class="quiet">休息</span><input class="field" value="150"></div></div><div class="sets"><div class="set"><div class="set-top"><b>1</b><div class="select">热身组⌄</div><button class="delete">删除</button></div><div class="set-bottom"><div class="field"><span>计划重量</span>20.0 kg</div><div class="field"><span>次数</span>10</div></div></div><div class="set"><div class="set-top"><b>2</b><div class="select">正式组⌄</div><button class="delete">删除</button></div><div class="set-bottom"><div class="field"><span>计划重量</span>80.0 kg</div><div class="field"><span>次数</span>8</div></div></div><button class="add">＋ 添加一组</button></div></article><button class="add">＋ 添加动作</button></main><main class="detail" id="detail"><h2>训练记录</h2><p class="quiet">图片、计划与实际表现一起复盘</p><article class="history"><div class="thumb">🏋️</div><div><b>杠铃卧推</b><div class="quiet">正式组 · 8 次 · 休息 150 秒</div></div><div class="weight"><div>80 → 82.5 kg</div><div class="delta">+2.5</div></div></article><article class="history"><div class="thumb">↔</div><div><b>胸托划船</b><div class="quiet">正式组 · 10 次 · 休息 120 秒</div></div><div class="weight"><div>50 → 50 kg</div><div class="quiet">达成计划</div></div></article></main><footer class="save" id="save"><button>保存计划</button></footer></section><script>const records=document.querySelector('#records'),composer=document.querySelector('#composer'),detail=document.querySelector('#detail'),save=document.querySelector('#save'),tabs=document.querySelectorAll('.tabs button');records.onclick=()=>{tabs.forEach(x=>x.classList.remove('active'));records.classList.add('active');composer.classList.add('hide');detail.classList.add('show');save.style.display='none'};tabs[0].onclick=()=>{tabs.forEach(x=>x.classList.remove('active'));tabs[0].classList.add('active');composer.classList.remove('hide');detail.classList.remove('show');save.style.display='block'};</script></body></html>

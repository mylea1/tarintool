<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>形域 AI 工具调用预览</title>
  <style>
    :root{color-scheme:light;--bg:#fff8f2;--surface:#fff;--ink:#2d211b;--muted:#776962;--accent:#e85b12;--soft:#ffe5d4;--line:#eadbd1;--ok:#26734d}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,"Microsoft YaHei",sans-serif}.phone{width:min(100%,414px);min-height:100dvh;margin:auto;padding:20px 16px 28px}.top{display:flex;align-items:center;justify-content:space-between}.brand{font-size:26px;font-weight:800}.consent{margin:18px 0;padding:14px;border:1px solid var(--line);border-radius:18px;background:var(--surface)}.consent-row{display:flex;gap:12px;align-items:flex-start}.consent strong{display:block}.consent p{margin:3px 0 0;color:var(--muted);font-size:13px}.switch{margin-left:auto;appearance:none;width:46px;height:28px;border-radius:999px;background:#c9c1bc;position:relative;flex:none}.switch:checked{background:var(--accent)}.switch:after{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;border-radius:50%;background:white;transition:.18s}.switch:checked:after{transform:translateX(18px)}.bubble{max-width:86%;margin:14px 0;padding:12px 14px;border-radius:18px;background:var(--surface);border:1px solid var(--line)}.bubble.me{margin-left:auto;background:var(--accent);color:white;border:0}.tool{display:flex;align-items:center;gap:10px;margin:12px 0;padding:11px 13px;border-radius:14px;background:var(--soft);color:#8b390f}.tool.done{background:#e8f5ed;color:var(--ok)}.dot{width:9px;height:9px;border-radius:50%;background:currentColor;animation:pulse 1.1s ease-in-out infinite}.tool.done .dot{animation:none}.composer{position:sticky;bottom:10px;display:flex;gap:8px;margin-top:28px;padding:8px;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 32px #6b35151c}.composer input{min-width:0;flex:1;border:0;outline:0;padding:9px;background:transparent;font:inherit}.composer button{border:0;border-radius:13px;padding:0 16px;background:var(--accent);color:#fff;font-weight:700}@keyframes pulse{50%{opacity:.28;transform:scale(.72)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <main class="phone">
    <header class="top"><span class="brand">AI 教练</span><span aria-label="更多设置">•••</span></header>
    <section class="consent">
      <div class="consent-row"><div><strong>按需读取训练资料</strong><p>仅在回答需要时读取你的计划和记录，不会修改内容。</p></div><input id="consent" class="switch" type="checkbox" checked aria-label="允许 AI 按需读取训练资料"></div>
    </section>
    <div class="bubble me">读取我的练胸计划，看看是否缺少后束训练。</div>
    <div id="tool" class="tool"><span class="dot"></span><span>正在读取你的训练计划</span></div>
    <div class="bubble">你的“胸肩 A”包含卧推、上斜推和夹胸，但没有直接训练肩后束的动作。可以在不增加太多总量的前提下，加 2 组反向飞鸟。</div>
    <form class="composer" onsubmit="event.preventDefault();document.querySelector('.bubble.me').textContent=this.q.value||'比较我最近三次训练';this.q.value=''">
      <input name="q" placeholder="询问计划、记录或恢复" aria-label="消息">
      <button>发送</button>
    </form>
  </main>
  <script>
    setTimeout(()=>{const el=document.getElementById('tool');el.classList.add('done');el.innerHTML='<span class="dot"></span><span>已读取 2 个训练计划</span>'},1200);
    document.getElementById('consent').addEventListener('change',e=>{const el=document.getElementById('tool');el.className='tool done';el.innerHTML='<span class="dot"></span><span>'+(e.target.checked?'已允许按需读取':'已关闭训练资料读取')+'</span>'});
  </script>
</body>
</html>

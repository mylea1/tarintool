<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KILO 暖橙主题预览</title>
  <style>
    :root {
      --canvas: #f4eee9;
      --paper: #fff8f2;
      --surface: #ffffff;
      --surface-soft: #fff0e5;
      --ink: #2b1d16;
      --muted: #6f594e;
      --primary: #c64f13;
      --primary-bright: #e76522;
      --primary-soft: #fde2d0;
      --line: #e8d8cd;
      --success: #26845b;
      --success-soft: #e4f4eb;
      font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--canvas); }
    button, input { font: inherit; }
    .stage { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .frame { width: min(390px, 100%); min-height: 780px; overflow: hidden; background: var(--paper); border: 1px solid var(--line); border-radius: 34px; box-shadow: 0 24px 70px rgba(74, 40, 23, .16); }
    .switcher { display: flex; gap: 8px; padding: 12px; background: rgba(255,255,255,.86); border-bottom: 1px solid var(--line); }
    .switcher button { flex: 1; min-height: 42px; border: 0; border-radius: 13px; color: var(--muted); background: transparent; cursor: pointer; }
    .switcher button[aria-selected="true"] { color: var(--primary); background: var(--primary-soft); font-weight: 750; }
    .screen { display: none; padding: 24px 20px 90px; }
    .screen.active { display: block; animation: enter .22s ease-out; }
    @keyframes enter { from { opacity: 0; transform: translateY(7px); } }
    .brand { width: 54px; height: 54px; display: grid; place-items: center; border-radius: 17px; color: white; background: linear-gradient(145deg, var(--primary-bright), var(--primary)); font-size: 22px; font-weight: 900; box-shadow: 0 10px 28px rgba(198,79,19,.25); }
    h1 { margin: 22px 0 6px; font-size: 28px; letter-spacing: -.8px; }
    h2 { margin: 0; font-size: 20px; }
    p { color: var(--muted); line-height: 1.5; }
    label { display: block; margin: 14px 0 6px; color: var(--muted); font-size: 13px; font-weight: 700; }
    input { width: 100%; min-width: 0; min-height: 50px; padding: 0 14px; border: 1px solid var(--line); border-radius: 14px; color: var(--ink); background: var(--surface); outline: none; }
    input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
    .primary { width: 100%; min-height: 50px; margin-top: 18px; border: 0; border-radius: 15px; color: white; background: var(--primary); font-weight: 800; cursor: pointer; }
    .primary:active { transform: scale(.985); }
    .test { margin-top: 14px; padding: 12px 14px; border-radius: 14px; color: #7d3613; background: var(--surface-soft); font-size: 13px; }
    .header { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .eyebrow { color: var(--primary); font-size: 12px; font-weight: 850; letter-spacing: 1.5px; }
    .avatar { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 50%; background: var(--primary-soft); color: var(--primary); font-weight: 850; }
    .card { margin-top: 18px; padding: 18px; border: 1px solid var(--line); border-radius: 19px; background: var(--surface); box-shadow: 0 8px 24px rgba(74,40,23,.06); }
    .hero { background: linear-gradient(150deg, #fff, #fff0e5); }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .pill { padding: 7px 10px; border-radius: 999px; color: var(--primary); background: var(--primary-soft); font-size: 12px; font-weight: 800; white-space: nowrap; }
    .exercise { display: grid; grid-template-columns: 36px minmax(0,1fr) 58px; align-items: center; gap: 10px; margin-top: 12px; padding: 12px; border-radius: 15px; background: #fffaf6; }
    .exercise span:nth-child(2) { min-width: 0; overflow-wrap: anywhere; }
    .set { text-align: center; border: 1px solid var(--line); border-radius: 10px; padding: 8px 4px; background: white; }
    .set.done { color: #176b47; border-color: #83c7a5; background: var(--success-soft); font-weight: 800; }
    .timer { margin-top: 16px; padding: 14px; border-radius: 16px; color: #6c2c0e; background: var(--primary-soft); }
    .fine { font-size: 12px; color: var(--muted); }
    @media (max-width: 340px) {
      .stage { padding: 0; }
      .frame { min-height: 100vh; border-radius: 0; border: 0; }
      .screen { padding-inline: 16px; }
      .switcher { gap: 4px; }
      .switcher button { padding-inline: 4px; }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <main class="stage">
    <section class="frame" aria-label="KILO 暖橙主题交互预览">
      <nav class="switcher" aria-label="预览页面">
        <button aria-selected="true" data-target="login">登录</button>
        <button aria-selected="false" data-target="home">主页</button>
        <button aria-selected="false" data-target="workout">训练</button>
      </nav>

      <section id="login" class="screen active">
        <div class="brand">K</div>
        <h1>登录 KILO</h1>
        <p>进入你的训练记录、计划与智能分析。</p>
        <label for="account">手机号或账号</label>
        <input id="account" value="1234" autocomplete="username" />
        <label for="password">密码</label>
        <input id="password" value="1234" type="password" autocomplete="current-password" />
        <button class="primary" id="loginButton">登录测试版</button>
        <div class="test" id="loginFeedback">测试管理员：1234 / 1234。仅测试构建开放。</div>
      </section>

      <section id="home" class="screen">
        <div class="header"><div><div class="eyebrow">KILO</div><h1>今天练得漂亮</h1></div><div class="avatar">赵</div></div>
        <article class="card hero">
          <div class="row"><span class="fine">今日训练</span><span class="pill">准备就绪</span></div>
          <h2 style="margin-top:10px">上肢力量 A</h2>
          <p>3 个动作 · 预计 48 分钟</p>
          <button class="primary">开始训练</button>
        </article>
        <article class="card"><div class="row"><h2>本周进度</h2><strong style="color:var(--primary)">3 / 4</strong></div><p>距离本周目标还差 1 次训练。</p></article>
      </section>

      <section id="workout" class="screen">
        <div class="header"><div><div class="eyebrow">进行中 · 12:36</div><h1>自由训练</h1></div><span class="pill">暂停</span></div>
        <div class="timer row"><strong>组间休息</strong><strong>00:45</strong></div>
        <article class="card">
          <div class="row"><div><h2>杠铃卧推</h2><span class="fine">胸部 · 休息 90 秒</span></div><span aria-label="更多操作">•••</span></div>
          <div class="exercise"><strong>1</strong><span>60 kg × 8</span><span class="set done">完成</span></div>
          <div class="exercise"><strong>2</strong><span>65 kg × 8</span><span class="set">待做</span></div>
          <button class="primary" id="finishSet">完成下一组</button>
        </article>
      </section>
    </section>
  </main>
  <script>
    const tabs = [...document.querySelectorAll('[data-target]')];
    tabs.forEach(tab => tab.addEventListener('click', () => {
      tabs.forEach(item => item.setAttribute('aria-selected', String(item === tab)));
      document.querySelectorAll('.screen').forEach(screen => screen.classList.toggle('active', screen.id === tab.dataset.target));
    }));
    document.querySelector('#loginButton').addEventListener('click', () => {
      document.querySelector('#loginFeedback').textContent = '✓ 登录成功：已进入测试管理员账号';
    });
    document.querySelector('#finishSet').addEventListener('click', event => {
      document.querySelectorAll('.set')[1].classList.add('done');
      document.querySelectorAll('.set')[1].textContent = '完成';
      event.currentTarget.textContent = '✓ 已完成 2 / 2 组';
    });
  </script>
</body>
</html>

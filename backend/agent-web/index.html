<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#F5F1EB"><title>KILO · 训练与饮食</title><link rel="stylesheet" href="/agent/styles.css"></head><body>
<div id="toast" role="status" aria-live="polite"></div>
<div class="shell"><aside class="sidebar"><a class="brand" href="/agent/"><strong class="brand-word">KILO<span class="brand-dot">.</span></strong><span>力量，来自每一次。</span></a><nav id="nav"></nav><div class="sidebar-foot"><span class="status-dot"></span><span id="storage-label">此电脑 · 本地存储</span><button id="account" class="quiet">登录</button></div></aside>
<div class="workspace"><header><div><span class="eyebrow">TRAIN / TRACK / PROGRESS</span><h1 id="page-title">每一次，都算数。</h1></div><div class="header-actions"><button id="theme" class="icon-button" aria-label="切换深浅色">◐</button><button class="primary" data-action="new-workout">＋ 开始训练</button></div></header><main id="content"></main><footer>按你的节奏，持续进步。<span id="save-state"></span></footer></div></div>
<nav id="mobile-nav" class="mobile-nav" aria-label="主导航"></nav>
<dialog id="login-dialog"><form id="login-form"><label>账户类型<select name="accountType"><option value="web">网页账号</option><option value="app">App 账号</option></select></label><span class="eyebrow">WELCOME TO KILO</span><h2>回到你的训练。</h2><p>登录此实例的账号。连接 App 云端账号可在设置中完成。</p><label>账号<input name="identifier" autocomplete="username" required></label><label>密码<input name="password" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">登录</button><button type="button" id="web-register-toggle">注册网页账号</button><button type="button" class="quiet" id="login-close">稍后</button><p id="login-error" class="error"></p></form></dialog>
<dialog id="exercise-dialog"><div class="dialog-head"><h2>选择动作</h2><button class="quiet" data-action="close-exercises">关闭</button></div><input id="exercise-query" type="search" placeholder="搜索动作，例如：卧推、深蹲" aria-label="搜索动作"><div class="filters"><select id="muscle-filter" aria-label="按肌群筛选"><option value="">所有肌群</option></select><select id="equipment-filter" aria-label="按器械筛选"><option value="">所有器械</option></select></div><p id="exercise-count" class="muted"></p><div id="exercise-results"></div></dialog>
<dialog id="detail-dialog"><div class="dialog-head"><h2>训练明细</h2><button class="quiet" data-action="close-detail">关闭</button></div><div id="detail-content"></div></dialog>
<script src="/agent/app.js" type="module"></script></body></html>

# Private compute-worker ingress. Only the fixed Tencent Lighthouse address may
# reach these routes; user-facing App traffic continues through Cloudflare.
server {
    listen 80;
    server_name 8.145.57.235;

    client_max_body_size 100m;

    location ^~ /v1/internal/gpu/ {
        allow 115.159.4.223;
        deny all;

        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location = /health {
        allow 115.159.4.223;
        deny all;
        proxy_pass http://127.0.0.1:8790/health;
    }

    location / {
        return 404;
    }
}
